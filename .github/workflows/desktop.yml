# Build Valnivo Crew for macOS (one universal app for Apple silicon and Intel) and Windows (installer),
# plus the signed updater files (macOS .app.tar.gz, Windows setup exe, and latest.json).
# Runs by hand (Actions -> Desktop apps -> Run workflow) or on a tag desktop-v*.
# The updater signing key is a secret of this repository and is optional (Kabil 2026-11-16: "no need for the signing keys for now").
# With it: signed updater files and latest.json, so the app offers the update in Settings. Without it: the installers are built with
# the updater files switched off and released without latest.json, so nothing unsigned is ever offered as an update; people install
# that version by hand from the release page.
# Apple and Windows certificates are separate. Until those exist, the first open can still show a system warning.
# Every released file gets a build provenance attestation (SLSA Build L2), signed by GitHub for this workflow run. Check a download:
#   gh attestation verify <file> -R valnivo-labs/valnivo-crew-desktop
# Outside actions are pinned to exact commits (the tag or branch they came from is in the comment).
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles app,dmg
            out: |
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          - os: windows-latest
            name: windows
            args: --bundles nsis
            out: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/nsis/*.sig
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            npx tauri build ${{ matrix.args }}
          else
            echo "No updater signing key on this repository: building the installers without updater files (manual install only)."
            npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valnivo-console-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    # every run publishes: a tag desktop-v* as that version, a run by hand as desktop-v<package.json version>.
    # Fixed-name copies keep one stable link for a manual install. latest.json is what the in-app updater reads.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # the signing certificate for the attestation
      attestations: write  # store the attestation on this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Gather the release files
        run: |
          set -euo pipefail
          # the artifacts keep their bundle folders (dmg/, macos/, nsis/): put every file at the top of dist/ first
          find dist -mindepth 2 -type f -exec mv -f -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="desktop-v$(node -p "require('./desktop/package.json').version")"; fi
          VER="${TAG#desktop-v}"
          if ls dist/*.sig >/dev/null 2>&1; then
            node desktop/ci/write-latest.mjs --dir dist --version "$VER" --tag "$TAG" --notes "Valnivo Crew ${VER} for macOS and Windows." --out dist/latest.json
            NOTE="The app can install the next version from Settings."
          else
            NOTE="This build has no updater signature: the app does not offer it as an update. Install it over the app you have from this page."
          fi
          cp dist/*.dmg dist/Valnivo-Crew-macOS.dmg
          cp dist/*setup*.exe dist/Valnivo-Crew-Windows-Setup.exe 2>/dev/null || cp dist/*.exe dist/Valnivo-Crew-Windows-Setup.exe
          ls -l dist
          { echo "TAG=$TAG"; echo "VER=$VER"; echo "NOTE=$NOTE"; } >> "$GITHUB_ENV"
          # every file the release will carry except the .sig files: its sha256, for the attestation (kept outside dist/)
          (cd dist && find . -maxdepth 1 -type f ! -name '*.sig' -printf '%f\n' | sort | xargs -d '\n' sha256sum) > subjects.txt
          cat subjects.txt
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "Valnivo Crew ${VER}" \
              --notes "Valnivo Crew ${VER} for macOS (universal) and Windows (x64). ${NOTE} The app is not signed with an Apple or Windows certificate: the first open can still show a system warning."
          fi
