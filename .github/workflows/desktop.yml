# Build Valnivo Crew for macOS (one universal app for Apple silicon and Intel) and Windows (installer).
# Runs by hand (Actions -> Desktop apps -> Run workflow) or on a tag desktop-v*. Every run keeps the files as artifacts;
# every run also publishes them as a GitHub Release of this repository (a tag as its version, a run by hand as desktop/package.json's).
# Not signed yet: macOS is ad-hoc signed, Windows unsigned; both warn on first open until the owner's certificates are added.
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles app,dmg
            out: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: --bundles nsis
            out: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: valnivo-console-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    # every run publishes (Kabil 15 Nov: "why the desktop apps didn't do the release"): a tag desktop-v* as that version, a run by hand
    # as desktop-v<version in desktop/package.json> (made or updated). Fixed-name copies make one stable link for the Console:
    # https://github.com/valnivo-labs/valnivo-crew-desktop/releases/latest/download/Valnivo-Crew-macOS.dmg (and -Windows-Setup.exe)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="desktop-v$(node -p "require('./desktop/package.json').version")"; fi
          cp dist/*.dmg dist/Valnivo-Crew-macOS.dmg
          cp dist/*setup*.exe dist/Valnivo-Crew-Windows-Setup.exe 2>/dev/null || cp dist/*.exe dist/Valnivo-Crew-Windows-Setup.exe
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "Valnivo Crew ${TAG#desktop-v}" \
              --notes "Valnivo Crew ${TAG#desktop-v} for macOS (universal .dmg, Apple silicon and Intel) and Windows (x64 setup .exe). Not signed yet: see the README for the first-open steps."
          fi
