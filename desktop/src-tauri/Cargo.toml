[package]
name = "valnivo-console"
version = "0.10.0"
description = "Valnivo Crew as an app for macOS and Windows"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"   # tauri::generate_context! expands to serde_json::json! once plugins.updater is in tauri.conf.json

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
